name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ── Print tool versions ────────────────────────────────────────────
      # These lines appear in the CI log so you can tell exactly which
      # Flutter/Dart/plugin versions produced any given APK.
      - name: Print versions
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Dart version ==="
          dart --version
          echo "=== Java version ==="
          java -version
          echo "=== BUILD_ID: run${{ github.run_number }} ==="

      # ── Generate android/ scaffold ─────────────────────────────────────
      # android/ is not committed — flutter create regenerates it so Gradle/
      # AGP versions always match the runner's Flutter SDK, not a hand-
      # maintained file that could go stale.
      - name: Generate fresh Android platform scaffolding
        run: |
          flutter create --platforms=android --org com.lipila --project-name lipila /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      # ── Patch manifest ────────────────────────────────────────────────
      # Uses the shared script also used for local builds so they cannot drift.
      # The script exits non-zero if the patch didn't apply or any permission
      # is missing — this is the only CI step that can catch a missing permission
      # before the APK lands on a device.
      - name: Patch AndroidManifest.xml
        run: python3 tool/patch_manifest.py

      # ── Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Print plugin versions from pubspec.lock ───────────────────────
      - name: Print plugin versions (pubspec.lock)
        run: |
          echo "=== Key plugin versions from pubspec.lock ==="
          grep -A1 "nfc_manager\|nfc_manager_ndef\|permission_handler\|mobile_scanner\|device_info_plus" pubspec.lock || true

      # ── Analyze ───────────────────────────────────────────────────────
      - name: Analyze (non-blocking)
        run: flutter analyze || true

      # ── Build DEBUG APK ───────────────────────────────────────────────
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=https://lipila.vercel.app/api \
            --dart-define=BUILD_ID=run${{ github.run_number }}

      # ── Build RELEASE APK ─────────────────────────────────────────────
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://lipila.vercel.app/api \
            --dart-define=BUILD_ID=run${{ github.run_number }}

      # ── SDK / permission diagnostics via aapt2 ────────────────────────
      # Verifies the manifest patch actually landed in the compiled APK.
      # CAMERA and NFC must appear; if either is missing the step fails.
      - name: Verify APK permissions (aapt2 dump)
        run: |
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name "aapt2" | sort -V | tail -1)
          echo "Using aapt2: $AAPT2"

          for APK in \
            build/app/outputs/flutter-apk/app-debug.apk \
            build/app/outputs/flutter-apk/app-release.apk; do

            echo ""
            echo "=== $APK ==="
            "$AAPT2" dump permissions "$APK"

            for PERM in \
              android.permission.CAMERA \
              android.permission.NFC; do
              if "$AAPT2" dump permissions "$APK" | grep -q "$PERM"; then
                echo "  OK: $PERM"
              else
                echo "  MISSING: $PERM  <-- BUILD FAILURE" >&2
                exit 1
              fi
            done
          done

      # ── Check R8 ran on release ───────────────────────────────────────
      # If the mapping directory is absent, R8 did not run and release is
      # unminified — unexpected and potentially masking shrink bugs.
      - name: Check R8 ran (release)
        run: |
          MAPPING_DIR="build/app/outputs/mapping/release"
          if [ -d "$MAPPING_DIR" ] && [ "$(ls -A "$MAPPING_DIR")" ]; then
            echo "R8 OK — mapping files present in $MAPPING_DIR"
            ls -lh "$MAPPING_DIR"
          else
            echo "WARNING: no mapping files in $MAPPING_DIR — R8 may not have run"
            echo "This means shrink/obfuscation is OFF. If you add proguard rules, verify they are wired."
          fi

      # ── Upload both APKs ──────────────────────────────────────────────
      # Artifact name is lipila-apks; both debug and release are zipped together
      # so you can install whichever one you need without two separate downloads.
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lipila-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
