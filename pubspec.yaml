name: lipila
description: "Lipila — scan, confirm, done. Native Android client with NFC Bong."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.4.0

  # Local session persistence
  shared_preferences: ^2.2.2

  # State management
  provider: ^6.1.2

  # QR scanning (camera) — fallback for devices without NFC
  mobile_scanner: ^5.2.3

  # Biometric confirmation
  local_auth: ^2.3.0

  # QR export as PDF
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4

  # Fonts
  google_fonts: ^6.2.1

  # ── Bong: NFC asymmetric proximity payment ──────────────────────────────
  # Two plugins for the two roles:
  #
  #   nfc_manager   — PAYER role: reads the NFC tag the payee's phone emits.
  #                   Supports Android and iOS (iOS read-only, which is fine
  #                   since Bong is Android-only for the emulator role).
  #
  #   flutter_nfc_hce — PAYEE role: makes this Android device emulate an NFC
  #                   card via Host Card Emulation (HCE). Android-only by
  #                   platform design; Apple locks HCE to Apple Pay.
  #
  # Devices without NFC fall back to QR scan automatically — the UI checks
  # NfcAvailability at startup and shows a clear message if NFC is absent.
  nfc_manager: ^3.3.0
  flutter_nfc_hce: ^0.1.8

  permission_handler: ^11.3.1
  uuid: ^4.4.2

  # Device info for diagnostics screen (SDK level, manufacturer, model).
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
